# ── Optimized configuration for Audoxidy ──────────────────────
#
# ## Profiling and coverage
#
#   cargo install cargo-llvm-cov
#   cargo llvm-cov                 # coverage + terminal report
#   cargo llvm-cov --html          # coverage + HTML report
#   cargo llvm-cov --open          # coverage + open in browser
#
# ## Benchmarks
#
#   cargo bench                    # all benchmarks
#   cargo bench --bench dsp_bench  # DSP only
#   cargo bench --bench engine_bench
#   cargo bench --bench utils_bench
#   open target/criterion/report/index.html  # HTML report
#
# ## Flamegraph (hot call mapping)
#
#   cargo install flamegraph
#   cargo flamegraph --bin audoxidy -- --help
#   # For real profiling: play audio while profiling
#   cargo flamegraph --bin audoxidy --root --output flame.svg
#
# ## Valgrind / Massif (memory profiling)
#
#   # Whole-application heap usage
#   valgrind --tool=massif --massif-out-file=massif.out ./target/release/audoxidy
#   # Visualize: massif-visualizer massif.out
#   # See peak usage: ms_print massif.out | head -60
#
#   # Call profiling (cachegrind)
#   valgrind --tool=callgrind --dump-instr=yes ./target/release/audoxidy
#   # Visualize: qcachegrind callgrind.out.*
#
# ## Fast compilation
#
#   cargo install sccache
#   cargo install cargo-nextest
#   cargo nextest run  # runs tests 2-3x faster than cargo test
#
# ## Fast linkers
#   Linux: sudo apt install lld clang
#   macOS: uses ld64 (fast native)
#   Windows: rustup component add llvm-tools

[build]
# rustc-wrapper = "sccache"  # Uncomment after installing sccache
# jobs = 8                   # Adjust to available CPU cores
