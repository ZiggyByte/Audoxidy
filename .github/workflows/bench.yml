name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpipewire-0.3-dev
      - name: Run benchmarks
        run: cargo bench --no-run
      - name: DSP benchmarks
        run: cargo bench --bench dsp_bench -- --quick 2>&1 | tail -20
