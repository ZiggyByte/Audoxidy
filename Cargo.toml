[package]
name = "audoxidy"
version = "0.7.0"
edition = "2024"
rust-version = "1.95"
authors = ["ZiggyCrue"]
description = "High-fidelity, high-performance, customizable desktop audio player."
readme = "README.md"
repository = "https://github.com/ZiggyByte/Audoxidy"
homepage = "https://github.com/ZiggyByte/Audoxidy"
documentation = "https://docs.rs/audoxidy"
license = "GPL-3.0-only"
keywords = ["audio", "player", "dsp", "crossfade", "rust"]
categories = ["multimedia::audio", "gui"]
exclude = ["/.planning", "/.changelogs-crates-update", "/cache", "/logs", "/graphify-out", "/.criterion", "*.db*"]

[dependencies]
async_ftp = "6.0.0"
audioadapter = "2.0.0"
audioadapter-buffers = "2.0.0"
audioadapter-sample = "2.0.0"
base64 = "0.22.1"
bumpalo = "3.17.0"
color-thief = "0.2.2"
cpal = "0.17.1"
crossbeam = "0.8"
fast_image_resize = "6.1.0"
fastrand = "2.3.0"
hex = "0.4.3"
iced = { version = "0.14.0", features = ["tokio", "image", "svg", "canvas", "advanced"] }
image = { version = "0.25.10", features = ["default", "png", "jpeg", "webp", "avif-native"] }
kmeans_colors = "0.7.1"
libloading = "0.9.0"
lofty = "0.25.1"
lru = "0.18.0"
memmap2 = "0.9.5"
parking_lot = "0.12.5"
rand = "0.9.2"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.12.12", features = ["json", "rustls-tls"] }
resvg = "0.46.0"
rfd = "0.17.2"
ringbuf = "0.4.8"
ron = "0.12.2"
rubato = "1.0.1"
rusqlite = { version = "0.38.0", features = ["bundled"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
souvlaki = "0.7.3"
symphonia = { version = "0.5.5", features = ["all", "opt-simd"] }
sysinfo = "0.38.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "registry"] }
usvg = "0.46.0"
walkdir = "2.5.0"
wide = "1.7.0"
zbus = "5.13.2"

[features]
default = []

[dev-dependencies]
criterion = { version = "0.6", features = ["html_reports"] }

[[bench]]
name = "dsp_bench"
harness = false

[[bench]]
name = "engine_bench"
harness = false

[[bench]]
name = "utils_bench"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.dev]
opt-level = 1
debug = true

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = true
strip = "none"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
